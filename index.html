<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Narrator">
<meta name="theme-color" content="#161c2e">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161c2e'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23d4a94c' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23d4a94c'/%3E%3C/svg%3E">
<title>Table Narrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;700&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column for a phone propped by the board — story scroll on top,
   one big "show the game master" action, then the heroes and the battle tray.
   Deliberately single dark theme: played at a dim table, it keeps glare off faces. */
:root {
  --night: #161c2e;
  --night-2: #1f2740;
  --night-3: #2b3556;
  --line: #3a4670;
  --ink: #e8e4d8;
  --ink-dim: #a3a9be;
  --gold: #d4a94c;
  --gold-deep: #9c7a2c;
  --gold-ink: #1a1408;
  --blood: #c4524a;
  --blood-soft: #e5847b;
  --verdigris: #6aa89a;
  --parchment: #efe3c8;
  --parchment-ink: #3a2c1a;
  --pip: #1d1a14;
  --scrim: rgba(5, 8, 16, .66);
  --err: #ff9b8f;
  --ui: "Rubik", system-ui, -apple-system, sans-serif;
  --tale-he: "Frank Ruhl Libre", "Times New Roman", serif;
  --tale-ru: "Alegreya", Georgia, serif;
  --tap: 48px;
  --dirsign: 1;
  color-scheme: dark;
}
[dir="rtl"] { --dirsign: -1; }

* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); margin: 0; }
[hidden] { display: none !important; }
body {
  font: 400 17px/1.5 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
  background: radial-gradient(120% 50% at 50% -10%, #2a3458 0%, transparent 60%), var(--night);
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
main { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-weight: 500; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; color: var(--ink-dim); margin: 18px 0 8px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.fine { color: var(--ink-dim); font-size: .82rem; text-align: center; }
.error { color: var(--err); min-height: 1.4em; font-size: .95rem; }
.notice { background: rgba(212, 169, 76, .12); border: 1px solid var(--gold-deep); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }

/* ---------- buttons ---------- */
.btn { min-height: var(--tap); border-radius: 12px; padding: 10px 16px; border: 1px solid var(--line); background: transparent; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
.btn.primary:disabled { background: var(--night-3); color: var(--ink-dim); border-color: var(--line); cursor: default; }
.btn.quiet { background: var(--night-3); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { min-width: var(--tap); min-height: var(--tap); border-radius: 50%; border: 1px solid transparent; background: none;
  color: var(--ink-dim); display: inline-grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; }
.link { background: none; border: 0; text-decoration: underline; padding: 6px 0; color: inherit; }

/* ---------- home ---------- */
#screen-home { min-height: 92dvh; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-block: 24px; }
.hero { text-align: center; display: grid; gap: 10px; justify-items: center; }
.sigil { width: 120px; height: 120px; fill: none; stroke: var(--gold); stroke-width: 1.2; }
.sigil .core { fill: rgba(212, 169, 76, .14); }
.hero h1 { display: grid; gap: 2px; }
.hero h1 [lang="he"] { font: 700 2.3rem/1.1 var(--tale-he); }
.hero h1 [lang="ru"] { font: italic 400 1.55rem/1.2 var(--tale-ru); color: var(--ink-dim); }
.lang-pick { display: grid; gap: 12px; }
.lang-pick .btn { min-height: 60px; font-size: 1.12rem; background: var(--night-2); }
.saved { display: grid; gap: 8px; }
.saved-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 8px 8px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--night-2); }
.saved-item .names { font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-item .when { color: var(--ink-dim); font-size: .8rem; }

/* ---------- bars & forms ---------- */
.bar { display: flex; align-items: center; gap: 2px; padding-block: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: linear-gradient(var(--night) 72%, transparent); }
.bar h2 { flex: 1; }
.bar .spacer { flex: 1; }
.btn-pause { min-height: 40px; border-radius: 20px; padding: 6px 16px; border: 1px solid var(--line); background: var(--night-3); font-weight: 500; }
.btn-pause.paused { background: var(--gold); color: var(--gold-ink); }
label { display: grid; gap: 4px; font-size: .88rem; color: var(--ink-dim); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--night-2); border: 1px solid var(--line); border-radius: 10px;
  min-height: var(--tap); padding: 8px 12px; width: 100%; }
textarea { resize: vertical; line-height: 1.5; }
input[type="range"] { padding: 0; accent-color: var(--gold); }
label.check { display: flex; align-items: center; gap: 10px; color: var(--ink); min-height: var(--tap); }
label.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--gold); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; padding: 14px;
  background: var(--night-2); border: 1px solid var(--line); border-radius: 14px; }
.wide { grid-column: 1 / -1; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; grid-column: 1 / -1; min-width: 0; }
.seg legend { color: var(--ink-dim); font-size: .88rem; margin-bottom: 4px; padding: 0; }
.seg label { flex: 1; display: block; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); color: var(--ink); padding: 0 8px; text-align: center; }
.seg input:checked + span { background: var(--night-3); border-color: var(--gold); color: var(--gold); }
.seg input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.setup-players { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; }
.setup-players li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 8px 0 8px 4px; border-bottom: 1px solid var(--line); }
.setup-players .stats { color: var(--ink-dim); font-size: .85rem; }
.setup-players .icon-btn { grid-row: 1 / span 2; grid-column: 2; }

/* ---------- story scroll (the one bold element) ---------- */
.scroll { margin: 4px 0 14px; padding: 18px 20px 10px; border-radius: 4px 4px 16px 16px; background: var(--parchment); color: var(--parchment-ink);
  box-shadow: inset 0 0 44px rgba(120, 84, 30, .28); display: grid; gap: 8px; }
.story { margin: 0; font-size: 1.22rem; line-height: 1.6; min-height: 3.2em; }
:lang(he) .story, :lang(he) .story-log p { font-family: var(--tale-he); font-size: 1.3rem; }
:lang(ru) .story, :lang(ru) .story-log p { font-family: var(--tale-ru); }
.story.fresh { animation: ink-in .7s ease-out; }
.story.writing { opacity: .8; }
@keyframes ink-in { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
.rules-line { font: 400 .9rem/1.45 var(--ui); color: var(--parchment-ink); opacity: .78; border-top: 1px solid rgba(58, 44, 26, .2); padding-top: 8px; }
.scroll-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: .9rem; }
.scroll-actions .status { margin-inline-start: auto; opacity: .7; }

/* ---------- look (camera) ---------- */
.look { display: grid; gap: 6px; margin-bottom: 16px; }
.look .btn.primary { min-height: 64px; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; overflow: hidden; }
.look .btn.primary svg { width: 26px; height: 26px; }
.look input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.look .hint { color: var(--ink-dim); font-size: .85rem; text-align: center; }
.sheet { width: min(640px, 100vw); max-height: 88dvh; margin: auto auto 0; border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0; background: var(--night-2); color: var(--ink);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet::backdrop { background: var(--scrim); }
.sheet .bar { background: var(--night-2); top: 0; }
.sheet-body { display: grid; gap: 12px; }
.photo { width: 100%; max-height: 32dvh; object-fit: contain; border-radius: 10px; background: #000; }
.busy { display: flex; align-items: center; gap: 10px; color: var(--ink-dim); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--gold); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.seen { font-size: 1rem; }
.card-view { background: var(--parchment); color: var(--parchment-ink); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.card-view .name { font-size: 1.2rem; font-weight: 700; }
.card-view .alt { font-size: .9rem; opacity: .75; }
.card-view .text { line-height: 1.5; white-space: pre-wrap; }
.card-view .type { font-size: .82rem; letter-spacing: .02em; opacity: .75; }
.card-view [lang="he"] { font-family: var(--tale-he); }
.card-view [lang="ru"] { font-family: var(--tale-ru); }
.choices { display: grid; gap: 8px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who label { display: block; position: relative; }
.who input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.who span { display: inline-flex; min-height: 40px; align-items: center; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); color: var(--ink); }
.who input:checked + span { border-color: var(--gold); color: var(--gold); background: var(--night-3); }
.who input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.dice-big { display: flex; gap: 10px; flex-wrap: wrap; }
.dice-big .face-wrap { width: 56px; height: 56px; padding: 7px; border-radius: 10px; background: var(--parchment); }
.warn { color: var(--gold); font-size: .9rem; }
.voice-warning { display: grid; gap: 10px; margin-bottom: 14px; }
.places-box { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
.places-box legend { color: var(--ink-dim); font-size: .88rem; padding: 0; margin-bottom: 6px; }
.places { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.places label { flex: none; }
#btn-music.off { opacity: .45; }
.own-music { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.own-music li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--line); }
.om-name { display: grid; min-width: 0; }
.om-file { color: var(--ink-dim); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.om-pick { position: relative; overflow: hidden; min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.om-pick input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.om-del { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.sheet a { color: var(--gold); }
#btn-music.off svg { stroke-dasharray: 3 2; }

/* ---------- players ---------- */
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.player { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 14px; background: var(--night-2); border: 1px solid var(--line); border-radius: 14px; }
.player.active { border-color: var(--gold); }
.player.out { opacity: .55; }
.player.downed { border-style: dashed; }
.p-head { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
.p-name { font-size: 1.1rem; }
.p-char { color: var(--ink-dim); font-size: .9rem; }
.p-stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .92rem; }
.stat i { font-style: normal; color: var(--ink-dim); margin-inline-end: 4px; }
.stat.str b { color: var(--gold); }
.stat.crf b { color: var(--verdigris); }
.counters { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.counter { display: flex; align-items: center; gap: 6px; }
.counter .val { min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }
.hearts { color: var(--blood); font-size: 1.15rem; letter-spacing: 1px; }
.coins { color: var(--gold); }
.mini { width: 34px; height: 34px; border-radius: 50%; background: none; border: 1px solid var(--line); color: var(--ink-dim); }
.btn-battle { grid-column: 2; grid-row: 1 / span 3; align-self: center; background: var(--night-3); border-color: var(--gold-deep); color: var(--gold); font-weight: 500; }
.village { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 76px auto; gap: 8px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
.village-note { color: var(--ink-dim); font-size: .9rem; }
.village .btn.primary { padding-inline: 12px; }
.village .buy-n[hidden] + .btn { grid-column: 2 / -1; }

/* ---------- battle ---------- */
.combat { margin: 16px 0; }
.combat-live { display: grid; gap: 14px; padding: 16px 14px; background: var(--night-2); border: 1px solid var(--gold-deep); border-radius: 16px; }
.beam { position: relative; height: 108px; }
.beam-arm { --tilt: 0deg; position: absolute; inset-inline: 7%; top: 26px; height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-deep));
  transform: rotate(calc(var(--tilt) * var(--dirsign))); transition: transform .7s cubic-bezier(.3, 1.4, .5, 1); }
.pan { position: absolute; top: 4px; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--gold-deep); background: var(--night);
  transform: rotate(calc(var(--tilt) * var(--dirsign) * -1)); transition: transform .7s cubic-bezier(.3, 1.4, .5, 1); }
.pan b { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pan-enemy { inset-inline-start: -34px; }
.pan-enemy b { color: var(--blood-soft); }
.pan-hero { inset-inline-end: -34px; }
.pan-hero b { color: var(--gold); }
.beam-post { position: absolute; left: 50%; top: 22px; width: 4px; height: 74px; margin-left: -2px; background: var(--line); border-radius: 2px; }
.beam-post::before { content: ""; position: absolute; top: -6px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); }
.dice-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dice-col { min-width: 0; }
.dice-col h4 { font-size: .9rem; font-weight: 500; color: var(--ink-dim); margin: 0 0 8px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.die-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px; border-radius: 12px; }
.die-pad.rerolling { outline: 2px dashed var(--gold); }
.die { aspect-ratio: 1; max-width: 100%; min-height: 44px; padding: 7px; border-radius: 10px; background: var(--parchment); border: 2px solid transparent; }
.die:disabled { opacity: .45; cursor: default; }
.die.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 169, 76, .35); opacity: 1; }
.face { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; }
.face i { display: block; margin: 16%; border-radius: 50%; }
.face i.pip { background: var(--pip); }
.die-pad[data-who="enemy"] .die.on .face i.pip { background: var(--blood); }
#btn-reroll.armed { border-color: var(--gold); color: var(--gold); }
.protection, .result { text-align: center; display: grid; gap: 10px; }
.protection p, .result p { font-size: 1.12rem; }
.result[data-outcome="player_wins"] p { color: var(--gold); }
.result[data-outcome="enemy_wins"] p { color: var(--blood-soft); }

/* ---------- story log ---------- */
.story-log { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.story-log li { display: grid; gap: 4px; }
.story-log p { line-height: 1.55; }
.story-log .rule { font: 400 .85rem var(--ui); color: var(--ink-dim); }
.toast { position: fixed; inset-inline: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: 420px; margin: 0 auto; background: var(--ink); color: var(--night); padding: 12px 16px; border-radius: 12px; text-align: center; z-index: 20; }

@media (max-width: 380px) {
  .pan { width: 56px; height: 56px; } .pan-enemy { inset-inline-start: -28px; } .pan-hero { inset-inline-end: -28px; }
  .pan b { font-size: 1.45rem; }
}
@media (prefers-reduced-motion: reduce) {
  .beam-arm, .pan { transition: none; }
  .story.fresh { animation: none; }
  .spinner { animation-duration: 3s; }
}

/* ---------- live camera ---------- */
.look #btn-live { min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.05rem; }
.look #btn-live svg { width: 24px; height: 24px; }
.live { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 16px; background: var(--night-2); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.live-view { position: relative; border-radius: 10px; overflow: hidden; background: #000; height: min(34vh, 60vw); width: 100%; min-width: 0; }
.live-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.live-dot { position: absolute; top: 10px; inset-inline-start: 10px; width: 14px; height: 14px; border-radius: 50%; background: #5fae6e; box-shadow: 0 0 0 3px rgba(0,0,0,.45); }
.live-dot[data-state="moving"], .live-dot[data-state="settling"] { background: var(--gold); }
.live-dot[data-state="looking"] { background: #6aa8e8; animation: pulse 1s ease-in-out infinite; }
.live-dot[data-state="dark"], .live-dot[data-state="off"] { background: #b55a4f; }
@keyframes pulse { 50% { transform: scale(1.35); } }
.live-status { margin: 0; color: var(--ink-dim); font-size: .9rem; min-height: 1.3em; }
.live-turn { display: grid; gap: 6px; font-size: .9rem; color: var(--ink-dim); }
.live-pending { border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; background: var(--night-3); }
.live-pending p { margin: 0; font-size: 1.05rem; color: var(--parchment); white-space: pre-line; }
.countdown { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.countdown i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
[dir="rtl"] .countdown i { transform-origin: right; }
.countdown i.run { transition: transform var(--dur, 4s) linear; transform: scaleX(0); }
.live .row { display: flex; gap: 8px; }
.live .row .btn { flex: 1; }
.key-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 14px 0; display: grid; gap: 8px; text-align: center; }
.key-box h3 { margin: 0; display: grid; gap: 2px; font-size: 1rem; }
.key-form { display: flex; gap: 8px; }
.key-form input { flex: 1; min-width: 0; }
.key-box .fine { margin: 0; }
.music-pack { position: relative; overflow: hidden; text-align: center; display: block; margin-bottom: 8px; }
.music-pack input { position: absolute; inset: 0; opacity: 0; font-size: 0; }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none !important; } .countdown i.run { transition: none; } }

</style>
</head>
<body>

<main id="app">

  <!-- Home: bilingual, before a language is chosen -->
  <section id="screen-home" class="screen">
    <div class="hero">
      <svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="38"/><circle class="core" cx="60" cy="60" r="20"/>
        <path d="M60 4v112M4 60h112"/>
      </svg>
      <h1><span lang="he">מספר הסיפורים</span><span lang="ru">Рассказчик</span></h1>
    </div>
    <div class="lang-pick">

        if (card.card_type === "enemy") Object.assign(facts, { combat_type: card.combat_type ?? null, enemy_value: card.enemy_value ?? null });
        return [{ ...state, drawn: [...state.drawn, { player: pl.id, card, seq: ev.seq }] },

    }

    const cue = (kind, facts) => ({ kind, facts, seq: ev.seq, interruptible: false });
    const r = c.result;
    if (c.phase === "awaiting_protection") {

    const respawn = lives === 0 && rules.deathRule === "respawn";

      location: respawn ? "Village" : pl.location };
    return [{ ...withPlayer(state, pl2), combat: c }, [cue("combat_resolved", {
      player: c.player.name, enemy: c.enemy.name, combat_type: c.type, outcome: r.outcome,
      player_roll: r.playerRoll, enemy_roll: r.enemyRoll, player_total: r.playerTotal, enemy_total: r.enemyTotal,
      margin: r.margin, lives_lost: r.livesLost, lives_left: lives, protection: r.protection,

  class Session {

    S.dropSeq = seq => { S.queue = S.queue.filter(l => l.seq < seq); if (S.current && S.current.seq >= seq && synth) synth.cancel(); };
    S.pause = () => { S.paused = true; if (synth) synth.pause(); };
    S.resume = () => { S.paused = false; if (synth) { synth.resume(); S.next(); } };
    S.stopAll = () => { S.queue = []; clearTimeout(S.watchdog); if (synth) synth.cancel(); S.speaking = false; S.current = null; music.duck(false); };
    S.test = sample => {          // must run inside a tap
      S.unlock();
      if (!S.available) return;
      S.stopAll();
      S.enqueue({ text: sample, seq: Infinity, interruptible: false, story: true });
    };
    if (synth) {
      try { synth.addEventListener("voiceschanged", () => refreshVoices()); } catch { synth.onvoiceschanged = () => refreshVoices(); }
    }
    const unlockAll = () => { S.unlock(); if (music.enabled && music.unlock()) updateMusic(); };
    for (const ev of ["pointerdown", "touchend", "click", "keydown"]) document.addEventListener(ev, unlockAll, { capture: true, passive: true });
    return S;
  })();

  // ---------- the one way the game changes ------------------------------------
  const STORY_TRIGGERS = new Set(["card_drawn", "combat_resolved", "player_recovered"]);
  function dispatch(type, payload, { quietStory = false } = {}) {
    showError("");
    let cues;
    try { cues = session.dispatch(type, payload); }
    catch (e) { showError(e.message); return null; }
    for (const cue of cues) {
      const line = narrator.narrate(cue);
      if (!line) continue;
      lastLine = line;
      game.lines.push({ seq: line.seq, text: line.text });
      setRulesLine(""); setStory(line.text, true);
      Speech.enqueue(line);
      pendingFacts.push({ kind: cue.kind, facts: cue.facts, seq: cue.seq });
    }
    for (const cue of cues) {
      if (cue.kind === "combat_resolved") {
        if (cue.facts.outcome === "player_wins") music.sting("victory");
        else if (cue.facts.outcome === "enemy_wins") music.sting("defeat");
        if (cue.facts.respawn) game.scene = "village";
      } else if (cue.kind === "card_drawn") music.sting("card");
    }
    save(); render(); updateMusic();
    if (!quietStory && cues.some(c => STORY_TRIGGERS.has(c.kind))) maybeTell(false);
    return cues;
  }

  // ---------- storyteller ------------------------------------------------------
  function setStory(text, fresh) {
    const el = $("#story"); el.textContent = text; el.classList.remove("writing");

  }
  function setRulesLine(text) { const el = $("#rules-line"); el.textContent = text; el.hidden = !text; }
  const gmCopy = code => ({ not_granted: "gm_denied", rate_limited: "gm_limit", images_unavailable: "gm_no_images",
    sampling_disabled: "gm_unavailable", capability_disabled: "gm_unavailable", capability_removed: "gm_unavailable",
    not_declared: "gm_unavailable", session_expired: "gm_unavailable", bad_key: "gm_bad_key", network: "gm_network" })[code] || "gm_error";
  function gmFailed(e) {
    const key = gmCopy(e && e.code);
    if (["gm_denied", "gm_unavailable", "gm_bad_key"].includes(key)) { gmBlocked = key; renderGmNote(); if (Live.eye) liveStop(); }
    return key;
  }

  async function maybeTell(force) {
    $("#btn-tell").hidden = true;
    if (!gm || gmBlocked || game.storyteller === "off" || !pendingFacts.length) { renderGmNote(); return; }
    const c = session.state.combat;
    if (!force && c && c.phase !== "resolved") return;          // let the battle finish first
    if (telling) return;                                          // the running call will pick these up next
    const facts = pendingFacts.splice(0);
    const ctl = new AbortController(); telling = ctl;
    const rulesText = lastLine ? lastLine.text : "";
    $("#story").classList.add("writing");
    $("#story-status").textContent = t("gm_writing");
    let shown = false;
    try {
      const res = await gm.tell({ lang, intensity: game.intensity, state: session.state,
        storySoFar: game.story.map(s => s.text), facts },
        { signal: ctl.signal, fast: game.storyteller !== "rich",
          onText: ({ text }) => { if (!shown) { shown = true; setRulesLine(rulesText); } $("#story").textContent = text; } });
      if (ctl.signal.aborted) return;
      const lastSeq = facts.at(-1).seq;
      if (!session.events.some(ev => ev.seq === lastSeq)) return;  // undone while Claude was writing
      if (res.text) {
        game.story.push({ seq: lastSeq, text: res.text });
        setStory(res.text, true); setRulesLine(rulesText);
        Speech.enqueue({ text: res.text, seq: lastSeq, interruptible: true, story: true });
        save();
      } else {
        setStory(rulesText, false); setRulesLine("");
        $("#story-status").textContent = t("story_rejected");
        return;
      }
      $("#story-status").textContent = "";
    } catch (e) {
      if (e && e.code === "cancelled") return;
      pendingFacts.unshift(...facts);                            // keep them for "Continue the story"
      setStory(rulesText || t("story_empty"), false); setRulesLine("");
      $("#story-status").textContent = t(gmFailed(e));
      $("#btn-tell").hidden = !!gmBlocked;
    } finally {
      if (telling === ctl) telling = null;
      $("#story").classList.remove("writing");
      if (pendingFacts.length && !gmBlocked && $("#btn-tell").hidden && (!session.state.combat || session.state.combat.phase === "resolved")
          && pendingFacts.some(f => STORY_TRIGGERS.has(f.kind))) maybeTell(false);
    }
  }

  function renderCombat() {
    const st = session.state, c = st.combat;

    if (c.phase === "resolved" && $("#combat").hidden) return;
    if (c.phase === "resolved" && !$("#combat-form").hidden) return;     // a new battle is being set up
    $("#combat").hidden = false; $("#combat-form").hidden = true; $("#combat-live").hidden = false;
    const base = c.player.attribute + c.player.modifiers.reduce((s, m) => s + m.value, 0);
    $("#enemy-label").textContent = `${c.enemy.name} (${c.enemy.attribute})`;
    $("#hero-label").textContent = `${c.player.name} (${base})`;
    const hero = playerTotal(c), foe = enemyTotal(c);
    $("#enemy-total").textContent = foe ?? "–"; $("#hero-total").textContent = hero ?? "–";
    const tilt = hero != null && foe != null ? Math.max(-14, Math.min(14, (hero - foe) * 4)) : 0;
    $("#beam-arm").style.setProperty("--tilt", tilt + "deg");
    $$('.die-pad[data-who="enemy"] .die').forEach(b => b.classList.toggle("on", Number(b.dataset.n) === c.enemyRoll));
    $$('.die-pad[data-who="player"] .die').forEach(b => b.classList.toggle("on", Number(b.dataset.n) === c.playerRoll));
    const open = c.phase === "awaiting_rolls", rules = session.rules;
    $$(".die").forEach(b => { b.disabled = !open; });
    $('.die-pad[data-who="player"]').classList.toggle("rerolling", rerollMode);
    const canReroll = open && c.playerRoll != null && c.fate >= rules.fateCostPerReroll && c.rerollsUsed < rules.maxRerollsPerRoll;
    $("#btn-reroll").hidden = !canReroll; $("#btn-reroll").classList.toggle("armed", rerollMode);
    $("#btn-resolve").hidden = !open; $("#btn-resolve").disabled = c.enemyRoll == null || c.playerRoll == null;
    $("#dice-photo-label").hidden = !open || !(gm && gm.imagesOk && !gmBlocked);
    $("#protection").hidden = c.phase !== "awaiting_protection";
    $("#result").hidden = c.phase !== "resolved";
    if (c.phase === "resolved") {

  // ---------- live camera: the game master watches and reacts by itself ----------
  // Every suggestion still goes through dispatch() — the rules engine decides —
  // and is shown with a short countdown so a wrong reading can be cancelled
  // (and Undo works as always).
  const LOOK_GAP = 5000, CARD_WAIT = 4500, DIE_WAIT = 3000, SAME_CARD_MS = 3 * 60 * 1000;

  function liveStatus(key, vars) {
    const text = key ? t(key, vars) : "";
    $("#live-status").textContent = text;
  }
  function liveDot(state) { $("#live-dot").dataset.state = state; }
  async function liveStart() {
    if (!gm || !gm.auto) { toast(t("live_need_key")); return; }
    if (Live.eye) return;
    Live.eye = new LiveEye({
      onLook: (blob, manual) => liveLook(blob, manual),
      onStatus: st => { if (!Live.busy) { liveDot(st); liveStatus({ moving: "live_moving", settling: "live_settling", dark: "live_dark" }[st] || (Live.waitUntil > Date.now() ? null : "live_calm")); } },
    });
    $("#live").hidden = false; renderLiveWho(); renderGmNote();
    try {
      await Live.eye.start($("#live-video"));
      const tr = Live.eye.stream.getVideoTracks()[0];
      if (tr) tr.addEventListener("ended", () => { if (Live.eye) { liveStop(); toast(t("live_stopped")); } });
      liveStatus("live_calm"); liveDot("calm");
      $("#live").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      Live.eye = null; $("#live").hidden = true; renderGmNote();
      toast(t(e && (e.name === "NotAllowedError" || e.name === "SecurityError") ? "live_denied" : "live_stopped"));
    }
  }
  function liveStop() {
    if (Live.eye) Live.eye.stop();
    Live.eye = null; clearTimeout(Live.timer); Live.queued = null;
    if (Live.ctl) Live.ctl.abort();
    clearPending();
    $("#live").hidden = true; renderGmNote();
  }
  $("#btn-live").onclick = liveStart;
  $("#live-stop").onclick = liveStop;
  $("#live-look").onclick = () => { if (Live.eye) Live.eye.lookNow(); };

  function renderLiveWho() {
    const box = $("#live-who"); box.textContent = "";
    if (!session) return;
    const st = session.state;
    if (!Live.turn || !st.players[Live.turn] || st.players[Live.turn].eliminated) Live.turn = defaultActor();
    st.order.map(id => st.players[id]).filter(p => !p.eliminated).forEach(p => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="radio" name="live-who"><span></span>`;
      const r = $("input", l); r.value = p.id; r.id = "live-who-" + p.id; r.checked = p.id === Live.turn;
      r.onchange = () => { Live.turn = p.id; lastActor = p.id; };
      $("span", l).textContent = p.name; box.append(l);
    });
  }

  // Looks are spaced out (the free Google tier allows only a few a minute);
  // a newer picture replaces one still waiting.
  function liveLook(blob, manual) {
    if (!Live.eye) return;
    const now = Date.now();
    const wait = Math.max(manual ? 0 : Live.lastLookAt + LOOK_GAP, Live.waitUntil) - now;
    if (Live.busy || wait > 0) {
      Live.queued = { blob, manual };
      if (!Live.busy) { clearTimeout(Live.timer); Live.timer = setTimeout(drainLive, wait); }
      return;
    }
    runLook(blob);
  }
  function drainLive() {
    const q = Live.queued; Live.queued = null;
    if (q && Live.eye) liveLook(q.blob, q.manual);
  }
  async function runLook(blob) {
    Live.busy = true; Live.lastLookAt = Date.now();
    liveDot("looking"); liveStatus("live_looking");
    const ctl = new AbortController(); Live.ctl = ctl;
    try {
      const res = await gm.look(blob, session.state, lang, ctl.signal);
      if (ctl.signal.aborted || !Live.eye) return;
      autoReact(res);
    } catch (e) {
      if (e && e.code === "cancelled") return;
      if (e && e.code === "rate_limited") {
        const s = e.retryAfter || 30;
        Live.waitUntil = Date.now() + s * 1000;
        liveStatus("live_wait", { s });
      } else liveStatus(gmFailed(e));
    } finally {
      if (Live.ctl === ctl) Live.ctl = null;
      Live.busy = false; liveDot(Live.eye ? "calm" : "off");
      if (Live.queued) { clearTimeout(Live.timer); Live.timer = setTimeout(drainLive, Math.max(0, Math.max(Live.lastLookAt + LOOK_GAP, Live.waitUntil) - Date.now())); }
    }
  }

  // A suggestion with a countdown: it happens by itself unless cancelled.
  function clearPending() {
    if (Live.pending) clearTimeout(Live.pending.timer);
    Live.pending = null;
    $("#live-pending").hidden = true;
  }
  function propose(text, act, ms, extra = []) {
    if (Live.pending) { const p = Live.pending; clearPending(); p.act(); }   // the table moved on: keep the earlier one
    const box = $("#live-pending"), actions = $("#live-pending-actions"), bar = $("#live-countdown");
    $("#live-pending-text").textContent = text; actions.textContent = "";
    const pend = { act, timer: null };
    const go = () => { if (Live.pending !== pend) return; clearPending(); act(); };
    const cancel = el("button", "btn", t("cancel")); cancel.onclick = () => { clearPending(); liveStatus("live_calm"); };
    const ok = el("button", "btn primary", t("live_ok")); ok.onclick = go;
    actions.append(cancel, ...extra.map(([label, fn]) => { const b = el("button", "btn", label); b.onclick = () => { clearPending(); fn(); }; return b; }), ok);
    box.hidden = false;
    bar.classList.remove("run"); bar.style.setProperty("--dur", "0s"); void bar.offsetWidth;
    if (ms) { bar.style.setProperty("--dur", ms + "ms"); bar.classList.add("run"); pend.timer = setTimeout(go, ms); }
    Live.pending = pend;
  }
  function choose(text, options) {     // no countdown: the players pick
    if (Live.pending) { const p = Live.pending; clearPending(); p.act(); }
    const box = $("#live-pending"), actions = $("#live-pending-actions");
    $("#live-pending-text").textContent = text; actions.textContent = "";
    const pend = { act: () => {}, timer: null };
    for (const [label, fn] of options) { const b = el("button", "btn", label); b.onclick = () => { clearPending(); fn(); }; actions.append(b); }
    const cancel = el("button", "btn", t("cancel")); cancel.onclick = () => clearPending(); actions.append(cancel);
    $("#live-countdown").classList.remove("run");
    box.hidden = false; Live.pending = pend;
  }

  const cardKey = c => String(c.name_he || c.name_ru || "").replace(/\s+/g, " ").trim().toLowerCase();
  const cardName = c => c["name_" + lang] || c.name_he || c.name_ru;
  function canFight(p) { const c = session.state.combat; return p && !p.downed && !p.eliminated && !(c && c.phase !== "resolved"); }

  // Both dice in: settle the battle by itself, after a pause for a Fate re-roll if one is possible.
  function afterDice() {
    const c = session.state.combat, rules = session.rules;
    if (!c || c.phase !== "awaiting_rolls" || c.enemyRoll == null || c.playerRoll == null) return;
    const resolve = () => { const cc = session.state.combat; if (cc && cc.phase === "awaiting_rolls") dispatch("combat_resolve", { player_has_protection: combatArmour }); };
    const canReroll = c.fate >= rules.fateCostPerReroll && c.rerollsUsed < rules.maxRerollsPerRoll;
    if (!canReroll) { resolve(); return; }
    propose(`${c.player.name} ${playerTotal(c)} : ${enemyTotal(c)} ${c.enemy.name}`, resolve, 6000,
      [[t("reroll"), () => { rerollMode = true; renderCombat(); }]]);
  }
  function autoReact(res) {
    const st = session.state;
    if (res.kind === "card" && res.card) {
      if (res.confidence === "low") { liveStatus("live_low"); return; }
      const c = res.card, key = cardKey(c);
      if (Live.lastCard && Live.lastCard.key === key && Date.now() - Live.lastCard.at < SAME_CARD_MS) { liveStatus("live_same_card"); return; }
      const pid = Live.turn && st.players[Live.turn] ? Live.turn : defaultActor(), p = st.players[pid];
      const battle = c.card_type === "enemy" && c.enemy_value != null && c.combat_type && canFight(p);
      let text = t("live_card", { card: cardName(c), player: p.name });
      if (battle) text += "\n" + t("live_battle", { player: p.name, enemy: cardName(c), type: t(c.combat_type), value: c.enemy_value });
      const take = () => {
        Live.lastCard = { key, at: Date.now() };
        lastActor = pid;
        if (!dispatch("card_drawn", { player_id: pid, card: c })) return false;
        return true;
      };
      const extra = battle ? [[t("live_edit"), () => { if (take()) openCombatForm(session.state.players[pid], { name: cardName(c), value: c.enemy_value, combat_type: c.combat_type }); }]] : [];
      propose(text, () => {
        if (!take() || !battle) return;
        const g = (game.gear || {})[pid] || {}, mods = [];
        if (g.weapon) mods.push({ source: t("weapon_bonus"), value: g.weapon, kind: "weapon" });
        if (g.other) mods.push({ source: t("other_bonus"), value: g.other, kind: "other" });
        combatArmour = !!g.armour; rerollMode = false; Live.battleDice = [];
        pendingCombatPlayer = session.state.players[pid];
        dispatch("combat_started", { player_id: pid, combat_type: c.combat_type, enemy_name: cardName(c), enemy_value: c.enemy_value, modifiers: mods });
      }, CARD_WAIT, extra);
      liveStatus(null);
      return;
    }
    if (res.kind === "dice" && res.dice.length) {
      const c = st.combat;
      if (!c || c.phase !== "awaiting_rolls") { liveStatus("live_dice_no_battle", { dice: res.dice.join(", ") }); return; }
      // dice still lying there from earlier in this battle are not new
      let fresh = res.dice.slice();
      if (fresh.length > 1) for (const used of Live.battleDice) { const i = fresh.indexOf(used); if (i >= 0 && fresh.length > 1) fresh.splice(i, 1); }
      const put = (who, n) => {
        Live.battleDice.push(n);
        if (who === "reroll") { rerollMode = false; dispatch("fate_reroll", { value: n }); }
        else dispatch(who === "enemy" ? "enemy_rolled" : "player_rolled", { value: n });
        afterDice();
      };
      if (rerollMode && c.playerRoll != null) {
        const n = fresh.at(-1);
        propose(t("live_die_reroll", { player: c.player.name, n }), () => put("reroll", n), DIE_WAIT);
      } else if (c.enemyRoll == null && c.playerRoll == null && fresh.length >= 2) {
        const [a, b] = fresh;
        if (a === b) { propose(`${t("live_die_enemy", { enemy: c.enemy.name, n: a })}\n${t("live_die_player", { player: c.player.name, n: b })}`, () => { Live.battleDice.push(a); dispatch("enemy_rolled", { value: a }); put("player", b); }, DIE_WAIT); }
        else choose(t("live_which"), [[`${c.enemy.name}: ${a} · ${c.player.name}: ${b}`, () => { Live.battleDice.push(a); dispatch("enemy_rolled", { value: a }); put("player", b); }],
          [`${c.enemy.name}: ${b} · ${c.player.name}: ${a}`, () => { Live.battleDice.push(b); dispatch("enemy_rolled", { value: b }); put("player", a); }]]);
      } else {
        const n = fresh[0];
        if (c.enemyRoll == null) propose(t("live_die_enemy", { enemy: c.enemy.name, n }), () => put("enemy", n), DIE_WAIT);
        else if (c.playerRoll == null) propose(t("live_die_player", { player: c.player.name, n }), () => put("player", n), DIE_WAIT);
        else liveStatus("live_dice_no_battle", { dice: res.dice.join(", ") });
      }
      liveStatus(null);
      return;
    }
    liveStatus("live_nothing", { seen: res.seen || "" });
  }

  // ---------- log & settings -------------------------------------------------------
  $("#btn-log").onclick = () => {
    const ol = $("#story-log"); ol.textContent = "";
    const items = [...game.lines.map(l => ({ ...l, rule: true })), ...game.story.map(s => ({ ...s, rule: false }))]
      .sort((a, b) => b.seq - a.seq || (a.rule ? 1 : -1));
    if (!items.length) ol.append(el("li", "fine", t("story_empty")));
    items.forEach(i => { const li = document.createElement("li"); li.append(el("p", i.rule ? "rule" : null, i.text)); ol.append(li); });
    $("#log-dlg").showModal();
  };
  $("#btn-settings").onclick = () => $("#settings-dlg").showModal();
  $$("dialog [data-close]").forEach(b => { b.onclick = () => b.closest("dialog").close(); });
  $("#set-intensity").onchange = e => { game.intensity = e.target.value; narrator = new Narrator(DATA.narration, lang, game.intensity); save(); };
  $("#set-storyteller").onchange = e => { game.storyteller = e.target.value; prefs.set("storyteller", e.target.value); save(); };
  $("#set-rate").value = Speech.rate;
  $("#set-mute").checked = Speech.muted;
  $("#set-rate").oninput = e => { Speech.rate = Number(e.target.value); prefs.set("rate", Speech.rate); };
  $("#set-mute").onchange = e => { Speech.muted = e.target.checked; if (Speech.muted) Speech.stopAll(); prefs.set("muted", Speech.muted); };
  $("#set-voice").onchange = e => { Speech.voiceURI = e.target.value; prefs.set("voice." + lang, e.target.value); };
  $("#btn-test-voice").onclick = testVoice;
  $("#btn-test-voice-2").onclick = testVoice;
  $("#btn-settings").addEventListener("click", refreshVoices);
  $("#btn-settings").addEventListener("click", renderOwnMusic);

  // ---------- the owner's free Google key (stand-alone site only) ---------------------
  const both = k => DATA.ui.he[k] + " · " + DATA.ui.ru[k];
  function renderKeyBox() {
    const box = $("#key-box");
    box.hidden = !SITE;
    if (!SITE) return;
    $$("[data-k]", box).forEach(e => { e.textContent = DATA.ui[e.lang][e.dataset.k]; });
    const has = !!prefs.get("gkey", "");
    $("#key-form").hidden = has && !box.dataset.editing;
    $("#key-change").hidden = !has || !!box.dataset.editing;
  }
  $("#key-change").onclick = () => { $("#key-box").dataset.editing = "1"; $("#key-input").value = ""; renderKeyBox(); $("#key-input").focus(); };
  $("#key-save").onclick = async () => {
    const key = $("#key-input").value.trim();
    if (!key) { $("#key-input").focus(); return; }
    const status = $("#key-status");
    status.textContent = both("key_checking");
    const g = new GeminiMaster(key);
    let verdict = "key_ok";
    try { await g.test(); } catch (e) { verdict = e.code === "bad_key" ? "key_bad" : e.code === "rate_limited" ? "key_limit" : "key_unchecked"; }
    status.textContent = both(verdict);
    if (verdict === "key_bad") return;
    prefs.set("gkey", key);
    gm = g; gmBlocked = null;
    delete $("#key-box").dataset.editing; $("#key-input").value = "";
    renderKeyBox();
  };

  // ---------- boot ------------------------------------------------------------------
  $$("[data-go=home]").forEach(b => { b.onclick = () => show("home"); });
  $$(".lang-pick .btn").forEach(b => {
    b.onclick = () => { setLang(b.dataset.lang); setupPlayers = []; renderSetupPlayers(); show("setup"); };
  });
  setLang(prefs.get("lang", "he"));
  show("home");
  window.addEventListener("beforeunload", () => { if (lang) prefs.set("lang", lang); });
  (async () => {
    const [st, master] = await Promise.all([new window.TMStorage().init(), GameMaster.connect().catch(() => null)]);
    storage = st; gm = master;
    if (!gm && SITE && prefs.get("gkey", "")) gm = new GeminiMaster(prefs.get("gkey", ""));
    renderKeyBox();
    if (!$("#screen-home").hidden) renderSaved();
    if (session) render();
  })();
  window.TMApp = { get session() { return session; }, get game() { return game; }, get gm() { return gm; }, set gm(v) { gm = v; }, music, currentScene, Live };  // for tests
})();

</script>
